name: Sonar — автопостинг новостей в Telegram

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sonar_bot/post_news.py

      - name: Save posted-log back to repo
        run: |
          git config user.name "sonar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sonar_bot/posted_log.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update posted log [skip ci]"
          git push
